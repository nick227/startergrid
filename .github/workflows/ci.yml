name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      # Builds the API server plus all three SPAs (operator, marketplace, splash).
      # This is the same command Railway runs — a break here is a break in prod.
      - run: npm run build:all
